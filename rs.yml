apiVersion: apps/v1
kind: ReplicaSet

metadata:
  name: first-replicaset
  labels: 
    type: front-end

spec:
  replicas: 3
  selector:
    matchLabels:
      type: front-end

  template:
    metadata: 
      name: anil-first-pod
      labels: 
        app: practice-pods
        env: production
        type: front-end
    spec:
      containers:
      - name: nginx-container
        image: nginx
  
  