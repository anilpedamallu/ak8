apiVersion: v1
kind: Pod
metadata:
  name: db_pod
  labels:
    app: db_app
    type: backend

spec:
  containers:
  - name: postgres
    image: postgres:15-alpine
    env:
      - name: POSTGRES_USER
        value: POSTGRES
      - name: POSTGRES_PASSWORD
        value: POSTGRES
    port:
      - containerPort: 5432
        name: postgres