apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis_deployment
  labels:
    app: redis_app

spec:
  replicas: 1
  selector: 
    matchLabels:
      app: redis_app
  
  template:
    metadata:
      name: redis_pod
      labels:
        app: redis_app
        type: backend

    spec:
      containers:
      - name: redis
        image: redis:alpine
        port:
          - containerPort: 6379
            name: redis  
