apiVersion: v1
kind: ReplicationController
metadata: 
  name: myapp-rc
  labels:
    app: myapp
    type: frontend
spec:
  template:
    metadata:
      name: myapp-pod
      labels: 
        app: myapp
        env: production
        type: frontend
    spec:
      containers:
      - name: redis
        image: redis    
  
  replicas: 3 


# to run the replication controller, run below command
# kubectl create -f rc-definition.yaml 


# to view list of replication controller created, run below command
# kubectl get replicationcontroller   